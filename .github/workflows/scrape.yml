name: Auto Scrape Fiscal Data

on:
  schedule:
    # Run every Monday at 6:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source (all, impots, jibaya, finances, axiane, custom)'
        default: 'all'
        required: false
      custom_url:
        description: 'Custom URL (only if source=custom)'
        required: false
      custom_label:
        description: 'Label for custom URL'
        required: false
      deep:
        description: 'Deep-crawl (follow links)'
        type: boolean
        default: false
      wiki:
        description: 'Search+scrape Wikipedia tax pages'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install crawl4ai requests beautifulsoup4
          python -m playwright install chromium

      - name: Weekly full scrape (all sources + deep)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python scripts/fiscal_scraper.py --source all
          python scripts/fiscal_scraper.py --wiki

      - name: Scrape all sources
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.source == '' || github.event.inputs.source == 'all') }}
        run: python scripts/fiscal_scraper.py --source all ${{ github.event.inputs.deep == 'true' && '--deep' || '' }}

      - name: Scrape specific source
        if: ${{ github.event.inputs.source != '' && github.event.inputs.source != 'all' && github.event.inputs.source != 'custom' }}
        run: python scripts/fiscal_scraper.py --source ${{ github.event.inputs.source }} ${{ github.event.inputs.deep == 'true' && '--deep' || '' }}

      - name: Scrape custom URL
        if: ${{ github.event.inputs.source == 'custom' }}
        run: python scripts/fiscal_scraper.py --url "${{ github.event.inputs.custom_url }}" --label "${{ github.event.inputs.custom_label }}" ${{ github.event.inputs.deep == 'true' && '--deep' || '' }}

      - name: Wikipedia tax search
        if: ${{ github.event.inputs.wiki == 'true' }}
        run: python scripts/fiscal_scraper.py --wiki

      - name: Commit scraped data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "scrape: auto-update fiscal data [skip ci]"
          git push
