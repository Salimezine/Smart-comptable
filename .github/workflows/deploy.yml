name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build with Supabase
        run: |
          export VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
          export VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          npm run build
      - name: Copy static pages
        run: |
          cp dist/index.html dist/app.html
          cp landing.html dist/index.html
          cp mentions-legales.html dist/mentions-legales.html
      - name: Debug build output
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD: $(git rev-parse HEAD)"
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "github.sha=${{ github.sha }}"
          echo "Event: ${{ github.event_name }}"
          echo "src files:"; ls -la src/*.jsx src/*.js src/*.css 2>/dev/null || true
          echo "vite config:"; cat vite.config.js
          echo "dist files:"; ls -la dist/assets/
      - name: Deploy to gh-pages branch
        run: |
          mkdir -p $HOME/deploy
          cp -r dist/. $HOME/deploy/
          cd $HOME/deploy
          git init
          git checkout -b gh-pages
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy: ${{ github.sha }}"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin gh-pages --force
