    <script>
      (function () {
        var API = 'https://smart-comptable-teif-api.ezzinesalim21.workers.dev/api';
        var statusEl = document.getElementById('gate-status');
        function status(msg) { if (statusEl) statusEl.textContent = msg; }
        function resetTurnstile() { if (window.turnstile && document.getElementById('gate')) window.turnstile.reset(); }
        function boot() {
          if (window.turnstile && window.turnstile.remove) window.turnstile.remove();
          var gate = document.getElementById('gate');
          if (gate) gate.remove();
          var urls = [
            '/Smart-comptable/assets/index-Cwu25Prp-v2.js',
            '/Smart-comptable/assets/autoPropagation-Aq8zKd2v.js'
          ];
          urls.forEach(function (u) {
            var s = document.createElement('script');
            s.type = 'module';
            s.crossOrigin = 'anonymous';
            s.src = u;
            document.head.appendChild(s);
          });
        }
        window.__onGateToken = function (token) {
          status('Vérification en cours…');
          fetch(API + '/turnstile/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token })
          }).then(function (r) {
            return r.json().catch(function () { return { success: false }; }).then(function (d) {
              return { ok: r.ok, d: d };
            });
          }).then(function (res) {
            if (res.ok && res.d && res.d.success) {
              status('');
              boot();
            } else {
              status('Vérification échouée. Veuillez réessayer.');
              resetTurnstile();
            }
          }).catch(function () {
            status('Impossible de contacter le serveur de vérification.');
            resetTurnstile();
          });
        };
        window.__onGateExpired = function () {
          status('');
          resetTurnstile();
        };
      })();
    </script>
